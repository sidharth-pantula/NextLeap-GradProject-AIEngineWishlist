services:
  - type: web
    name: wishlist-discovery-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
